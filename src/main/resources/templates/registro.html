<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro - Mano a Mano</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        .caja { max-width: 420px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 8px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input[type=text], input[type=email], input[type=password] { width: 100%; padding: 8px; box-sizing: border-box; }
        .error { color: #b00020; font-size: 14px; }
        .exito { background: #d4edda; color: #155724; padding: 10px; border-radius: 4px; }
        button { margin-top: 16px; width: 100%; padding: 10px; background: #1f77b4; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<div class="caja">
    <h2>Crear cuenta de cliente</h2>

    <div class="exito" th:if="${param.exito}">
        Registro exitoso. Revisa tu correo para activar tu cuenta.
    </div>
    <div class="error" th:if="${errorNegocio}" th:text="${errorNegocio}"></div>

    <form th:action="@{/registro}" th:object="${form}" method="post">

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" th:field="*{nombre}">
        <div class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>

        <label for="correo">Correo</label>
        <input type="email" id="correo" th:field="*{correo}">
        <div class="error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>

        <label for="telefono">Teléfono</label>
        <input type="text" id="telefono" th:field="*{telefono}">

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" th:field="*{contrasena}">
        <div class="error" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"></div>

        <label for="confirmarContrasena">Confirmar contraseña</label>
        <input type="password" id="confirmarContrasena" th:field="*{confirmarContrasena}">
        <div class="error" th:if="${#fields.hasErrors('confirmarContrasena')}" th:errors="*{confirmarContrasena}"></div>

        <label>
            <input type="checkbox" th:field="*{aceptaTerminos}">
            Acepto los términos y la política de datos
        </label>
        <div class="error" th:if="${#fields.hasErrors('aceptaTerminos')}" th:errors="*{aceptaTerminos}"></div>

        <button type="submit">Registrarme</button>
    </form>
</div>
</body>
</html>
