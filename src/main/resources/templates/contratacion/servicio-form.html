<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar servicio | Mano a Mano</title>
</head>
<body>
    <main>
        <h1>Solicitar un servicio</h1>

        <form th:action="@{/servicios}" th:object="${servicioForm}" method="post">
            <div>
                <label for="descripcion">¿Qué necesitas?</label>
                <textarea id="descripcion" th:field="*{descripcion}" rows="4"></textarea>
                <p th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}">Error</p>
            </div>

            <div>
                <label for="ubicacion">¿Dónde?</label>
                <input type="text" id="ubicacion" th:field="*{ubicacion}">
                <p th:if="${#fields.hasErrors('ubicacion')}" th:errors="*{ubicacion}">Error</p>
            </div>

            <button type="submit">Solicitar</button>
        </form>
    </main>
</body>
</html>
