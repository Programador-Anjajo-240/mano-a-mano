<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar - Mano a Mano</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        .caja { max-width: 380px; margin: 60px auto; background: #fff; padding: 24px; border-radius: 8px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input[type=email], input[type=password] { width: 100%; padding: 8px; box-sizing: border-box; }
        .error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
        .ok { background: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
        button { margin-top: 16px; width: 100%; padding: 10px; background: #1f77b4; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<div class="caja">
    <h2>Iniciar sesión</h2>

    <div class="error" th:if="${param.error}">Correo o contraseña incorrectos, o la cuenta está inactiva o bloqueada.</div>
    <div class="ok" th:if="${param.logout}">Sesión cerrada correctamente.</div>

    <form th:action="@{/login}" method="post">
        <label for="username">Correo</label>
        <input type="email" id="username" name="username" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Entrar</button>
    </form>
    <p><a th:href="@{/registro}">Crear cuenta</a></p>
</div>
</body>
</html>
